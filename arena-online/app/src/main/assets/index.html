<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0d111c"><title>Arena Online</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d111c;color:#f3f6ff;font:15px system-ui}header{padding:16px;border-bottom:1px solid #263148}h1{margin:0;font-size:22px}main{padding:14px;max-width:700px;margin:auto}.panel{background:#151c2b;border:1px solid #263148;border-radius:16px;padding:14px;margin-bottom:12px}input{background:#0f1522;color:white;border:1px solid #34415c;border-radius:11px;padding:12px;width:100%;font:inherit}button{background:#7d6cff;color:white;border:0;border-radius:11px;padding:11px 14px;font:inherit}button:disabled{opacity:.5}canvas{display:block;width:100%;aspect-ratio:1/1;background:#101827;border-radius:14px;border:1px solid #34415c;touch-action:none}.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}.muted{color:#a4b0c8;font-size:13px}.stats{display:flex;justify-content:space-between;margin:8px 0}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:250px;margin:12px auto}.controls button{font-size:22px;touch-action:manipulation}.hidden{display:none}
</style></head><body><header><h1>⚔ Arena Online</h1><div class="muted">2D çevrimiçi arena • Erken sürüm</div></header><main>
<section id="lobby" class="panel"><h3>Arenaya katıl</h3><input id="name" maxlength="16" placeholder="Oyuncu adın" value="Oyuncu"><input id="server" style="margin-top:8px" placeholder="wss://sunucu-adresin/ (WebSocket URL)"><div class="row"><button id="connect">Bağlan</button><button id="practice">Çevrimdışı dene</button></div><p id="status" class="muted">Çevrimiçi maç için oyun sunucusu adresi gerekir.</p></section>
<section id="game" class="panel hidden"><div class="stats"><span id="who">Oyuncu</span><span>Skor: <b id="score">0</b></span><span id="state">Hazır</span></div><canvas id="arena" width="600" height="600"></canvas><div class="controls"><span></span><button data-move="up">▲</button><span></span><button data-move="left">◀</button><button data-move="down">▼</button><button data-move="right">▶</button></div><div class="row"><button id="leave">Ayrıl</button><button id="again">Yeniden başla</button></div><p class="muted">Çevrimdışı deneme botlarla çalışır. Çevrimiçi modda sunucu oyuncu konumlarını ve skorları yönetmelidir.</p></section>
</main><script>
const $=id=>document.getElementById(id),canvas=$("arena"),ctx=canvas.getContext("2d");let ws=null,online=false,playing=false,score=0,player={id:"local",name:"Oyuncu",x:300,y:300,r:15,color:"#8b7cff"},others=[],orbs=[],keys={},last=0;
function spawn(){orbs=[];for(let i=0;i<18;i++)orbs.push({x:25+Math.random()*550,y:25+Math.random()*550,r:7})}
function draw(){ctx.clearRect(0,0,600,600);ctx.strokeStyle="#202d43";for(let i=0;i<=600;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,600);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(600,i);ctx.stroke()}orbs.forEach(o=>{ctx.fillStyle="#ffcc66";ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill()});others.forEach(p=>drawPlayer(p));drawPlayer(player)}
function drawPlayer(p){ctx.fillStyle=p.color||"#ff6f91";ctx.beginPath();ctx.arc(p.x,p.y,p.r||15,0,Math.PI*2);ctx.fill();ctx.fillStyle="#f3f6ff";ctx.font="13px system-ui";ctx.textAlign="center";ctx.fillText((p.name||"Oyuncu").slice(0,12),p.x,p.y-22)}
function frame(t){if(!playing)return;let dt=Math.min((t-last)/16||1,2);last=t;if(!online){let dx=0,dy=0;if(keys.left||keys.ArrowLeft)dx--;if(keys.right||keys.ArrowRight)dx++;if(keys.up||keys.ArrowUp)dy--;if(keys.down||keys.ArrowDown)dy++;let len=Math.hypot(dx,dy)||1;player.x=Math.max(15,Math.min(585,player.x+dx/len*3.2*dt));player.y=Math.max(15,Math.min(585,player.y+dy/len*3.2*dt));orbs=orbs.filter(o=>{if(Math.hypot(o.x-player.x,o.y-player.y)<player.r+o.r){score+=10;$("score").textContent=score;return false}return true});if(orbs.length<10)orbs.push({x:25+Math.random()*550,y:25+Math.random()*550,r:7})}else if(ws&&ws.readyState===1){ws.send(JSON.stringify({type:"move",x:player.x,y:player.y}))}draw();requestAnimationFrame(frame)}
function start(isOnline){online=isOnline;playing=true;score=0;player.x=300;player.y=300;$("score").textContent=score;$("who").textContent=player.name;$("lobby").classList.add("hidden");$("game").classList.remove("hidden");spawn();requestAnimationFrame(frame)}
function setStatus(s){$("status").textContent=s}
$("practice").onclick=()=>{player.name=$("name").value.trim()||"Oyuncu";others=[];start(false);$("state").textContent="Çevrimdışı"};
$("connect").onclick=()=>{let url=$("server").value.trim();if(!url.startsWith("wss://")){setStatus("Güvenli WebSocket adresi wss:// ile başlamalı.");return}try{ws=new WebSocket(url);setStatus("Sunucuya bağlanılıyor…");ws.onopen=()=>{player.name=$("name").value.trim()||"Oyuncu";ws.send(JSON.stringify({type:"join",name:player.name}));setStatus("Bağlandı");$("state").textContent="Çevrimiçi";start(true)};ws.onmessage=e=>{try{let d=JSON.parse(e.data);if(d.type==="state"){others=d.players.filter(p=>p.id!==d.you);let me=d.players.find(p=>p.id===d.you);if(me)player={...player,...me};orbs=d.orbs||orbs;score=d.score||score;$("score").textContent=score}}catch(_){}};ws.onerror=()=>setStatus("Sunucu bağlantı hatası.");ws.onclose=()=>{if(playing){playing=false;setStatus("Sunucu bağlantısı kesildi.")}}}catch(e){setStatus("Adres geçersiz.")}};
function leave(){playing=false;if(ws){ws.close();ws=null}online=false;$("game").classList.add("hidden");$("lobby").classList.remove("hidden");setStatus("Ayrıldın.")}$("leave").onclick=leave;$("again").onclick=()=>{playing=false;setTimeout(()=>start(online),80)};
document.querySelectorAll("[data-move]").forEach(b=>{let k=b.dataset.move;b.onpointerdown=e=>{e.preventDefault();keys[k]=true};b.onpointerup=b.onpointerleave=()=>keys[k]=false});window.addEventListener("keydown",e=>{keys[e.key]=true});window.addEventListener("keyup",e=>{keys[e.key]=false});
draw();
</script></body></html>
